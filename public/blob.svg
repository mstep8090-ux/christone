<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blobGlow1" cx="50%" cy="50%" r="50%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFC2CE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blobGlow2" cx="50%" cy="50%" r="50%" fx="60%" fy="65%">
      <stop offset="0%" stop-color="#E84367" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#FF85A0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blobCore" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#FFF0F3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFC2CE" stop-opacity="0" />
    </radialGradient>
    <filter id="blobBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <style>
    .blob-layer-1 {
      transform-origin: 200px 200px;
      animation: blob-spin 22s ease-in-out infinite alternate;
    }
    .blob-layer-2 {
      transform-origin: 200px 200px;
      animation: blob-morph 16s ease-in-out infinite alternate;
    }
    .blob-layer-core {
      transform-origin: 200px 200px;
      animation: blob-breathe 8s ease-in-out infinite alternate;
    }

    @keyframes blob-spin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }
    @keyframes blob-morph {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.08, 0.94) rotate(-90deg); }
      100% { transform: scale(0.96, 1.06) rotate(-180deg); }
    }
    @keyframes blob-breathe {
      0% { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }
  </style>

  <g filter="url(#blobBlur)">
    <!-- Morphing Fluid Blob Layer 1 -->
    <path class="blob-layer-1" d="M300 200C300 255.228 255.228 300 200 300C144.772 300 100 255.228 100 200C100 144.772 144.772 100 200 100C255.228 100 300 144.772 300 200Z" fill="url(#blobGlow1)" />
    <!-- Secondary Organic Wave Shape -->
    <path class="blob-layer-2" d="M330 190C340 260 270 330 195 325C120 320 85 250 95 180C105 110 180 80 250 95C320 110 320 120 330 190Z" fill="url(#blobGlow2)" />
    <!-- Luminous Core -->
    <circle class="blob-layer-core" cx="200" cy="200" r="110" fill="url(#blobCore)" />
  </g>
</svg>
