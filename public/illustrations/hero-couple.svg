    <!-- Subtle shared cushion/ground line -->
    <path d="M100,252 C150,250 250,250 300,252" stroke-opacity="0.3" />

    <!-- Delicate small heart or spark between their shared gaze -->
    <path d="M200,120 C200,116 195,112 192,114 C189,116 189,120 200,128 C211,120 211,116 208,114 C205,112 200,116 200,120 Z" stroke="#FF5A7E" fill="#FF5A7E" fill-opacity="0.2" />
