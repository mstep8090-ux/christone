    <!-- Partner 1 hands resting gently forward -->
    <path d="M130,146 C144,162 168,180 188,186 C196,188 206,188 214,186" />

    <!-- Partner 2 (Right) - Head, gentle tilt facing partner, calm seated posture -->
    <path d="M252,88 C256,72 248,60 238,56 C226,52 214,60 212,72 C210,82 218,92 226,96 C234,100 248,98 252,88 Z" />
    <path d="M234,99 C244,110 262,124 270,146 C278,168 280,202 278,238 C278,246 272,252 264,252 L198,252" />
    <path d="M226,96 C218,108 210,126 208,154 C206,180 212,206 218,232" />
    <!-- Partner 2 hands resting gently forward meeting partner -->
