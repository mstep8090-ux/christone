<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist continuous line art of a couple sitting together facing each other, fully clothed, abstract -->
  <g stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Partner 1 (Left) - Head, gentle tilt, relaxed sitting posture -->
