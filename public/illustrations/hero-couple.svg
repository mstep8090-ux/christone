<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="hc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFC2CE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hc-warmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFC2CE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hc-man-coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#2D282A"/>
    </linearGradient>
    <linearGradient id="hc-woman-dress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A7E"/>
      <stop offset="50%" stop-color="#E84367"/>
      <stop offset="100%" stop-color="#D63356"/>
    </linearGradient>
    <linearGradient id="hc-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F6"/>
      <stop offset="100%" stop-color="#FFD6DE"/>
    </linearGradient>
    <linearGradient id="hc-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3033"/>
      <stop offset="100%" stop-color="#1A1A1E"/>
    </linearGradient>
    <linearGradient id="hc-heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A7E"/>
      <stop offset="100%" stop-color="#E84367"/>
    </linearGradient>
    <filter id="hc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF5A7E" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    @keyframes hc-breathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }
    @keyframes hc-heartbeat {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.95; }
      14% { transform: scale(1.22) translateY(-2px); opacity: 1; }
      28% { transform: scale(1.08) translateY(-1px); opacity: 0.98; }
      42% { transform: scale(1.28) translateY(-3px); opacity: 1; }
      70% { transform: scale(1) translateY(0); opacity: 0.95; }
    }
    @keyframes hc-star {
      0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.2; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }
    @keyframes hc-aura {
      0%, 100% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .hc-couple-group {
      animation: hc-breathe 5s ease-in-out infinite;
      transform-origin: 200px 240px;
    }
    .hc-beating-heart {
      animation: hc-heartbeat 2.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      transform-origin: 200px 145px;
    }
    .hc-aura-circle {
      animation: hc-aura 4s ease-in-out infinite;
      transform-origin: 200px 150px;
    }
    .hc-sparkle-1 {
      animation: hc-star 3s ease-in-out infinite;
      transform-origin: 200px 65px;
    }
    .hc-sparkle-2 {
      animation: hc-star 3.4s ease-in-out infinite 0.8s;
      transform-origin: 105px 95px;
    }
    .hc-sparkle-3 {
      animation: hc-star 2.8s ease-in-out infinite 1.4s;
      transform-origin: 295px 95px;
    }
  </style>

  <!-- Ambient Halo Background -->
  <circle class="hc-aura-circle" cx="200" cy="150" r="120" fill="url(#hc-bg)"/>
  <ellipse cx="200" cy="255" rx="140" ry="12" fill="#1A1A1E" opacity="0.05"/>

  <!-- Heavenly Twinkling Sparkles -->
  <g class="hc-sparkle-1">
    <path d="M200 55 L202 62 L209 64 L202 66 L200 73 L198 66 L191 64 L198 62 Z" fill="#FF5A7E"/>
    <circle cx="200" cy="64" r="1.5" fill="#FFFFFF"/>
  </g>
  <g class="hc-sparkle-2">
    <path d="M105 88 L106.5 93.5 L112 95 L106.5 96.5 L105 102 L103.5 96.5 L98 95 L103.5 93.5 Z" fill="#FFAEBE"/>
    <circle cx="105" cy="95" r="1.2" fill="#FFFFFF"/>
  </g>
  <g class="hc-sparkle-3">
    <path d="M295 88 L296.5 93.5 L302 95 L296.5 96.5 L295 102 L293.5 96.5 L288 95 L293.5 93.5 Z" fill="#FF5A7E"/>
    <circle cx="295" cy="95" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Floating Loving Covenant Heart (Between their shared gaze) -->
  <g class="hc-beating-heart" filter="url(#hc-shadow)">
    <path d="M200 148 C196 142 188 140 184 145 C180 150 182 156 186 160 L200 172 L214 160 C218 156 220 150 216 145 C212 140 204 142 200 148 Z" fill="url(#hc-heart)"/>
    <circle cx="192" cy="146" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Main Seated Couple Group -->
  <g class="hc-couple-group" filter="url(#hc-shadow)">
    <!-- Seated Base Bench / Velvet Cushion -->
    <rect x="90" y="246" width="220" height="12" rx="6" fill="#F5E6E8"/>
    <rect x="100" y="244" width="200" height="4" rx="2" fill="#FFFFFF"/>

    <!-- ================= PARTNER A (HIM, Left) ================= -->
    <!-- Torso / Sleek Blazer -->
    <path d="M152 118 C140 126 126 142 122 170 C118 198 120 226 122 248 L178 248 C176 228 174 204 172 174 C168 144 160 124 152 118 Z" fill="url(#hc-man-coat)"/>
    
    <!-- White Inner Collar Shirt -->
    <path d="M148 116 L158 132 L150 148 L142 126 Z" fill="#FFFFFF"/>
    <path d="M156 122 L152 148" stroke="#FF5A7E" stroke-width="1.5"/>

    <!-- Arm resting gently forward -->
    <path d="M130 162 C136 174 152 192 176 198 C184 200 196 200 204 196" stroke="#1A1A1E" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="202" cy="196" r="6" fill="url(#hc-skin)"/>

    <!-- Neck & Head -->
    <path d="M148 104 L154 118 L160 118 L158 104 Z" fill="url(#hc-skin)"/>
    <circle cx="156" cy="92" r="18" fill="url(#hc-skin)"/>

    <!-- Hair (Sharp, clean crop) -->
    <path d="M140 90 C140 76 150 68 164 70 C174 72 178 80 176 90 C172 84 164 80 156 82 C148 84 142 88 140 90 Z" fill="url(#hc-hair)"/>

    <!-- Peaceful Facial Contour Gaze -->
    <path d="M164 92 C166 94 168 96 166 98" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ================= PARTNER B (HER, Right) ================= -->
    <!-- Flowing Rose Dress -->
    <path d="M248 118 C260 126 274 142 278 170 C282 198 280 226 278 248 L222 248 C224 228 226 204 228 174 C232 144 240 124 248 118 Z" fill="url(#hc-woman-dress)"/>

    <!-- Dress Highlight Soft Sheen -->
    <path d="M242 138 C248 160 252 190 250 230" stroke="#FFC2CE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Arm resting gently forward to meet his hand -->
    <path d="M270 162 C264 174 248 192 224 198 C216 200 204 200 196 196" stroke="#E84367" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="198" cy="196" r="6" fill="url(#hc-skin)"/>

    <!-- Hands Intertwined in Covenant Contact -->
    <ellipse cx="200" cy="196" rx="8" ry="6" fill="url(#hc-skin)" stroke="#FF5A7E" stroke-width="1.5"/>

    <!-- Neck & Head -->
    <path d="M252 104 L246 118 L240 118 L242 104 Z" fill="url(#hc-skin)"/>
    <circle cx="244" cy="92" r="17" fill="url(#hc-skin)"/>

    <!-- Long Elegant Hair (Draped down shoulder) -->
    <path d="M232 86 C236 74 248 68 260 72 C272 76 274 90 272 106 C270 122 264 136 260 152 C258 140 262 116 256 102 C252 94 242 90 232 86 Z" fill="url(#hc-hair)"/>

    <!-- Peaceful Facial Contour Gaze -->
    <path d="M236 92 C234 94 232 96 234 98" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
