<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <radialGradient id="mi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#FFC2CE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mi-ring-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="30%" stop-color="#FF5A7E"/>
      <stop offset="70%" stop-color="#E84367"/>
      <stop offset="100%" stop-color="#FFAEBE"/>
    </linearGradient>
    <linearGradient id="mi-ring-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFD6DE"/>
      <stop offset="75%" stop-color="#FF5A7E"/>
      <stop offset="100%" stop-color="#C22047"/>
    </linearGradient>
    <linearGradient id="mi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mi-heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A7E"/>
      <stop offset="100%" stop-color="#E84367"/>
    </linearGradient>
    <filter id="mi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#FF5A7E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <style>
    @keyframes mi-pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes mi-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    @keyframes mi-heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1.06); }
      45% { transform: scale(1.22); }
      75% { transform: scale(1); }
    }
    @keyframes mi-twinkle {
      0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }
    .mi-rings-group {
      animation: mi-float 5s ease-in-out infinite;
      transform-origin: 150px 145px;
    }
    .mi-glow-pulse {
      animation: mi-pulse 4s ease-in-out infinite;
      transform-origin: 150px 145px;
    }
    .mi-heart-beat {
      animation: mi-heartbeat 2.4s ease-in-out infinite;
      transform-origin: 150px 142px;
    }
    .mi-star-1 {
      animation: mi-twinkle 3s ease-in-out infinite;
      transform-origin: 150px 58px;
    }
    .mi-star-2 {
      animation: mi-twinkle 3.2s ease-in-out infinite 0.7s;
      transform-origin: 62px 105px;
    }
    .mi-star-3 {
      animation: mi-twinkle 2.8s ease-in-out infinite 1.3s;
      transform-origin: 238px 105px;
    }
  </style>

  <!-- Ambient Radiant Glow -->
  <circle class="mi-glow-pulse" cx="150" cy="145" r="110" fill="url(#mi-glow)"/>

  <!-- Celestial Stars -->
  <g class="mi-star-1">
    <path d="M150 48 L152 55 L159 57 L152 59 L150 66 L148 59 L141 57 L148 55 Z" fill="#FF5A7E"/>
    <circle cx="150" cy="57" r="1.5" fill="#FFFFFF"/>
  </g>
  <g class="mi-star-2">
    <path d="M62 98 L63.5 103.5 L69 105 L63.5 106.5 L62 112 L60.5 106.5 L55 105 L60.5 103.5 Z" fill="#FFAEBE"/>
    <circle cx="62" cy="105" r="1.2" fill="#FFFFFF"/>
  </g>
  <g class="mi-star-3">
    <path d="M238 98 L239.5 103.5 L245 105 L239.5 106.5 L238 112 L236.5 106.5 L231 105 L236.5 103.5 Z" fill="#FF5A7E"/>
    <circle cx="238" cy="105" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Grounding Soft Shadow -->
  <ellipse cx="150" cy="235" rx="75" ry="10" fill="#1A1A1E" opacity="0.06"/>

  <!-- Main Intertwined Covenant Rings Group -->
  <g class="mi-rings-group" filter="url(#mi-shadow)">
    <!-- LEFT RING (Her Rose Gold Covenant Band) -->
    <g>
      <!-- Outer torus -->
      <circle cx="120" cy="145" r="52" stroke="url(#mi-ring-a)" stroke-width="14" fill="none"/>
      <!-- Inner specular gleam -->
      <circle cx="120" cy="145" r="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="24 80" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Solitaire Diamond on Ring A -->
      <g transform="translate(108, 88)">
        <polygon points="12,0 18,7 12,14 6,7" fill="#FFFFFF"/>
        <polygon points="12,0 18,7 12,14 6,7" stroke="#FF5A7E" stroke-width="1.2" fill="none"/>
        <circle cx="12" cy="7" r="2" fill="#FFC2CE"/>
      </g>
    </g>

    <!-- RIGHT RING (His Pure Gold / Rose Accent Band) Interlocking -->
    <g>
      <!-- Outer torus -->
      <circle cx="180" cy="145" r="52" stroke="url(#mi-gold)" stroke-width="14" fill="none"/>
      <!-- Inner specular gleam -->
      <circle cx="180" cy="145" r="52" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="28 85" stroke-linecap="round" fill="none" opacity="0.85"/>
    </g>

    <!-- Weave Overlap Illusion (Re-drawing top arc of Left Ring so it truly interlocks) -->
    <path d="M120 93 A52 52 0 0 1 156 108" stroke="url(#mi-ring-a)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M120 93 A52 52 0 0 1 156 108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- CENTER COVENANT HEART (Beating with divine love) -->
    <g class="mi-heart-beat">
      <path d="M150 134 C146 128 138 126 134 131 C130 136 132 142 136 146 L150 158 L164 146 C168 142 170 136 166 131 C162 126 154 128 150 134 Z" fill="url(#mi-heart)"/>
      <!-- Highlight -->
      <circle cx="142" cy="132" r="1.5" fill="#FFFFFF" opacity="0.8"/>

      <!-- Sacred Cross inside the heart intersection -->
      <line x1="150" y1="138" x2="150" y2="152" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="145" y1="142" x2="155" y2="142" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Flowing Micro Hearts / Blessings floating upward -->
  <path d="M110 200 C110 198 107 197 105 199 C104 201 105 203 106 204 L110 208 L114 204 C115 203 116 201 115 199 C113 197 110 198 110 200 Z" fill="#FFC2CE" opacity="0.8"/>
  <path d="M190 200 C190 198 187 197 185 199 C184 201 185 203 186 204 L190 208 L194 204 C195 203 196 201 195 199 C193 197 190 198 190 200 Z" fill="#FF5A7E" opacity="0.8"/>
</svg>
