<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Celestial Sky Gradient -->
    <linearGradient id="pur-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1B36" />
      <stop offset="40%" stop-color="#4A2545" />
      <stop offset="75%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#FFF0F3" />
    </linearGradient>

    <!-- Star Beacon Halo -->
    <radialGradient id="pur-star-halo" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE082" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FF5A7E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2D1B36" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="pur-mountain-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2545" />
      <stop offset="100%" stop-color="#2D1B36" />
    </linearGradient>
    <linearGradient id="pur-mountain-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A7E" />
      <stop offset="40%" stop-color="#8E2D48" />
      <stop offset="100%" stop-color="#3D1525" />
    </linearGradient>

    <!-- Compass Dial Metallic Gradient -->
    <linearGradient id="pur-compass-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFCE6" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#FFA245" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <!-- Compass Needle Red & White Gradients -->
    <linearGradient id="pur-needle-n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A0" />
      <stop offset="50%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <filter id="pur-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5A7E" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .pur-beacon-pulse {
      transform-origin: 120px 30px;
      animation: pur-beacon-glow 3.5s ease-in-out infinite alternate;
    }
    .pur-compass-float {
      transform-origin: 120px 92px;
      animation: pur-hover 4s ease-in-out infinite;
    }
    .pur-needle-sway-anim {
      transform-origin: 120px 92px;
      animation: pur-sway 4s ease-in-out infinite;
    }
    .pur-shooting-meteor {
      animation: pur-meteor 5s linear infinite;
    }
    .pur-constellation-twinkle {
      animation: pur-twinkle-group 3s ease-in-out infinite alternate;
    }

    @keyframes pur-beacon-glow {
      0% { transform: scale(0.92); opacity: 0.75; }
      100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px rgba(255,215,0,0.9)); }
    }
    @keyframes pur-hover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes pur-sway {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(7deg); }
    }
    @keyframes pur-meteor {
      0% { transform: translate(-30px, -20px); opacity: 0; }
      20% { opacity: 1; }
      40% { transform: translate(140px, 80px); opacity: 0; }
      100% { transform: translate(140px, 80px); opacity: 0; }
    }
    @keyframes pur-twinkle-group {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Twilight Sky Canvas -->
  <rect width="240" height="140" fill="url(#pur-sky)" />

  <!-- Celestial Constellation Map in Night Sky -->
  <g class="pur-constellation-twinkle" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1 2" stroke-opacity="0.4">
    <!-- Faith Cross Constellation (Left Sky) -->
    <line x1="35" y1="20" x2="35" y2="45" />
    <line x1="25" y1="28" x2="45" y2="28" />
    <circle cx="35" cy="20" r="1.5" fill="#FFF" />
    <circle cx="35" cy="45" r="1.5" fill="#FFF" />
    <circle cx="25" cy="28" r="1.5" fill="#FFF" />
    <circle cx="45" cy="28" r="1.5" fill="#FFF" />
    <circle cx="35" cy="28" r="2" fill="#FFD700" />

    <!-- Crown of Destiny Constellation (Right Sky) -->
    <path d="M190 28L198 18L206 28L214 18L222 28" fill="none" />
    <circle cx="190" cy="28" r="1.5" fill="#FFF" />
    <circle cx="198" cy="18" r="2" fill="#FFD700" />
    <circle cx="206" cy="28" r="1.5" fill="#FFF" />
    <circle cx="214" cy="18" r="2" fill="#FFD700" />
    <circle cx="222" cy="28" r="1.5" fill="#FFF" />
  </g>

  <!-- Shooting Star Streak -->
  <g class="pur-shooting-meteor">
    <line x1="30" y1="15" x2="65" y2="35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <circle cx="65" cy="35" r="2.5" fill="#FFD700" />
  </g>

  <!-- Majestic Silhouette Mountain Peaks of Purpose -->
  <!-- Distant Purple Mountains -->
  <polygon points="-20,140 40,75 100,120 180,68 260,140" fill="url(#pur-mountain-back)" />
  <polygon points="180,68 185,74 175,74" fill="#FFFFFF" fill-opacity="0.4" />

  <!-- Foreground Mountaintop Ridge with Summit -->
  <polygon points="-10,140 70,88 120,62 170,88 250,140" fill="url(#pur-mountain-front)" filter="url(#pur-drop)" />
  <!-- Golden Summit Pathway Leading to High Calling -->
  <path d="M120 62L116 80L124 100L117 122L120 140" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 3" />
  <!-- Snow / Light Cap on Summit Peak -->
  <polygon points="120,62 112,72 128,72" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Radiant Guiding North Star Beacon above Summit -->
  <circle class="pur-beacon-pulse" cx="120" cy="30" r="50" fill="url(#pur-star-halo)" />
  <g class="pur-beacon-pulse">
    <!-- Brilliant 8-Point Diamond Beacon Star -->
    <path d="M120 12L124 24L136 21L128 30L137 38L124 36L120 48L116 36L103 38L112 30L104 21L116 24Z" 
          fill="#FFFFFF" filter="url(#pur-drop)" />
    <!-- Golden Star Core -->
    <circle cx="120" cy="30" r="4.5" fill="#FFD700" />
    <circle cx="120" cy="30" r="2" fill="#FFFFFF" />
  </g>

  <!-- Animated Celestial Compass of Calling at the Center Base -->
  <g class="pur-compass-float">
    <!-- Outer Bezel Ring with Metallic Rim -->
    <circle cx="120" cy="92" r="32" fill="url(#pur-compass-gold)" filter="url(#pur-drop)" stroke="#FFFFFF" stroke-width="2" />
    <!-- Inner Dial Face -->
    <circle cx="120" cy="92" r="26" fill="#FFFFFF" stroke="#F5E6E8" stroke-width="1.2" />
    <circle cx="120" cy="92" r="22" stroke="#FF5A7E" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.4" fill="none" />

    <!-- Cardinal Degree Ticks -->
    <line x1="120" y1="68" x2="120" y2="72" stroke="#E84367" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="112" x2="120" y2="116" stroke="#6B5B5F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="96" y1="92" x2="100" y2="92" stroke="#6B5B5F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="140" y1="92" x2="144" y2="92" stroke="#6B5B5F" stroke-width="1.5" stroke-linecap="round" />

    <!-- "N" For North Heading -->
    <text x="120" y="66" font-family="sans-serif" font-size="7" font-weight="bold" fill="#E84367" text-anchor="middle">N</text>

    <!-- Swaying Living Compass Needle -->
    <g class="pur-needle-sway-anim">
      <!-- North Pointer (Vibrant Rose) -->
      <polygon points="120,70 124,92 120,89" fill="url(#pur-needle-n)" filter="url(#pur-drop)" />
      <polygon points="120,70 116,92 120,89" fill="#FF85A0" />

      <!-- South Pointer (Silver/Ink) -->
      <polygon points="120,114 124,92 120,95" fill="#D9C3C7" />
      <polygon points="120,114 116,92 120,95" fill="#EFE2E4" />

      <!-- Central Pivot Jewel -->
      <circle cx="120" cy="92" r="5" fill="#FFFFFF" stroke="#FF5A7E" stroke-width="1.5" />
      <circle cx="120" cy="92" r="2.5" fill="#FF5A7E" />
    </g>
  </g>
</svg>
