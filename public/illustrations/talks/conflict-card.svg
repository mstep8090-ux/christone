<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="cnf-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="45%" stop-color="#EBF5EE" />
      <stop offset="85%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Peace Aura Glow -->
    <radialGradient id="cnf-peace-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#DDF2E6" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#FFC2CE" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dove Body Gradient -->
    <linearGradient id="cnf-dove-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFDCE3" />
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="cnf-wing" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD6DF" />
      <stop offset="60%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Olive Leaves Gradient -->
    <linearGradient id="cnf-olive-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E8BC" />
      <stop offset="50%" stop-color="#4CA46F" />
      <stop offset="100%" stop-color="#2D6B45" />
    </linearGradient>

    <!-- Hands Gradients -->
    <linearGradient id="cnf-hand-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE8E8" />
      <stop offset="70%" stop-color="#FCD2D8" />
      <stop offset="100%" stop-color="#F6B8C2" />
    </linearGradient>
    <linearGradient id="cnf-hand-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0ED" />
      <stop offset="70%" stop-color="#FDDAD4" />
      <stop offset="100%" stop-color="#F8B8B0" />
    </linearGradient>

    <filter id="cnf-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5A7E" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .cnf-aura-pulse {
      transform-origin: 120px 55px;
      animation: cnf-glow-pulse 4s ease-in-out infinite alternate;
    }
    .cnf-rainbow-anim {
      animation: cnf-rainbow-glow 3.5s ease-in-out infinite alternate;
    }
    .cnf-dove-flight {
      transform-origin: 120px 48px;
      animation: cnf-dove-hover 3.2s ease-in-out infinite;
    }
    .cnf-wing-left {
      transform-origin: 110px 44px;
      animation: cnf-wing-flap 1.6s ease-in-out infinite alternate;
    }
    .cnf-wing-right {
      transform-origin: 130px 44px;
      animation: cnf-wing-flap 1.6s ease-in-out infinite alternate;
    }
    .cnf-hands-clasp {
      transform-origin: 120px 105px;
      animation: cnf-hand-glow 3s ease-in-out infinite alternate;
    }
    .cnf-heart-float {
      transform-origin: 120px 88px;
      animation: cnf-heartbeat 1.8s ease-in-out infinite;
    }
    .cnf-leaf-float-1 {
      animation: cnf-drift 4s ease-in-out infinite;
    }
    .cnf-leaf-float-2 {
      animation: cnf-drift 4.5s ease-in-out infinite 1.5s;
    }
    .cnf-star-1 {
      transform-origin: 35px 25px;
      animation: cnf-twinkle 2.5s ease-in-out infinite;
    }
    .cnf-star-2 {
      transform-origin: 205px 25px;
      animation: cnf-twinkle 3s ease-in-out infinite 0.7s;
    }

    @keyframes cnf-glow-pulse {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes cnf-rainbow-glow {
      0% { opacity: 0.55; }
      100% { opacity: 0.95; filter: drop-shadow(0 0 8px rgba(221,242,230,0.8)); }
    }
    @keyframes cnf-dove-hover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4.5px) rotate(-1.5deg); }
    }
    @keyframes cnf-wing-flap {
      0% { transform: scaleY(0.85) rotate(-3deg); }
      100% { transform: scaleY(1.12) rotate(4deg); }
    }
    @keyframes cnf-hand-glow {
      0% { transform: translateY(0px) scale(0.98); }
      100% { transform: translateY(-1.5px) scale(1.02); filter: drop-shadow(0 0 6px rgba(255,194,206,0.6)); }
    }
    @keyframes cnf-heartbeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,90,126,0.3)); }
      25% { transform: scale(1.18); filter: drop-shadow(0 0 8px rgba(255,90,126,0.9)); }
      50% { transform: scale(1.06); }
      75% { transform: scale(1.12); filter: drop-shadow(0 0 4px rgba(255,90,126,0.6)); }
    }
    @keyframes cnf-drift {
      0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
      30% { opacity: 0.8; }
      80% { opacity: 0.4; }
      100% { opacity: 0; transform: translate(16px, 20px) rotate(60deg); }
    }
    @keyframes cnf-twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
  </style>

  <!-- Sky Canvas -->
  <rect width="240" height="140" fill="url(#cnf-sky)" />

  <!-- Heavenly Peace Aura -->
  <circle class="cnf-aura-pulse" cx="120" cy="55" r="75" fill="url(#cnf-peace-aura)" />

  <!-- Covenant Pastel Rainbow of Reconciliation -->
  <g class="cnf-rainbow-anim" opacity="0.75">
    <ellipse cx="120" cy="85" rx="90" ry="70" stroke="#FFD6DF" stroke-width="4" fill="none" stroke-opacity="0.5" />
    <ellipse cx="120" cy="85" rx="86" ry="67" stroke="#FFE082" stroke-width="3" fill="none" stroke-opacity="0.4" />
    <ellipse cx="120" cy="85" rx="83" ry="64" stroke="#DDF2E6" stroke-width="3" fill="none" stroke-opacity="0.6" />
  </g>

  <!-- Animated Flying Cartoon Peace Dove -->
  <g class="cnf-dove-flight">
    <!-- Left Wing (Spread Wide) -->
    <g class="cnf-wing-left">
      <path d="M112 44C102 30 84 26 72 32C64 36 66 44 76 46C88 48 104 48 112 44Z" 
            fill="url(#cnf-wing)" filter="url(#cnf-drop)" />
      <!-- Feather Ribs -->
      <path d="M78 36C86 38 98 40 106 43" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Right Wing (Spread Wide) -->
    <g class="cnf-wing-right">
      <path d="M128 44C138 30 156 26 168 32C176 36 174 44 164 46C152 48 136 48 128 44Z" 
            fill="url(#cnf-wing)" filter="url(#cnf-drop)" />
      <path d="M162 36C154 38 142 40 134 43" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Dove Body and Graceful Plump Tail -->
    <path d="M120 32C113 32 108 38 108 45C108 55 115 62 120 66C125 62 132 55 132 45C132 38 127 32 120 32Z" 
          fill="url(#cnf-dove-body)" filter="url(#cnf-drop)" />

    <!-- Tail Feathers Fan -->
    <path d="M120 62L112 75C116 76 124 76 128 75L120 62Z" fill="#FFF0F3" />

    <!-- Cute Cartoon Dove Head -->
    <circle cx="120" cy="30" r="7" fill="#FFFFFF" />
    <!-- Expressive Loving Dove Eye -->
    <ellipse cx="118.5" cy="29" rx="1.4" ry="1.8" fill="#1A1A1E" />
    <circle cx="118.2" cy="28.5" r="0.6" fill="#FFFFFF" />
    <ellipse cx="121.5" cy="29" rx="1.4" ry="1.8" fill="#1A1A1E" />
    <circle cx="121.2" cy="28.5" r="0.6" fill="#FFFFFF" />
    <!-- Rosy Cheek Blushes -->
    <circle cx="116" cy="31" r="1.3" fill="#FF5A7E" fill-opacity="0.6" />
    <circle cx="124" cy="31" r="1.3" fill="#FF5A7E" fill-opacity="0.6" />

    <!-- Golden Beak Holding Olive Sprig -->
    <polygon points="119,32 121,32 120,35" fill="#FFA245" />

    <!-- Emerald Olive Branch Held in Beak -->
    <!-- Curved Stem -->
    <path d="M120 34C114 36 102 38 96 35" stroke="#3B8659" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Left Leaf -->
    <path d="M108 33C104 29 108 26 112 28C112 32 110 33 108 33Z" fill="url(#cnf-olive-leaf)" />
    <!-- Center Leaf -->
    <path d="M102 37C98 34 100 30 104 31C105 35 103 37 102 37Z" fill="url(#cnf-olive-leaf)" />
    <!-- Golden Olive Fruit of Peace -->
    <circle cx="104" cy="36" r="2.2" fill="#FFD700" />
    <circle cx="103.5" cy="35.5" r="0.7" fill="#FFFFFF" />
  </g>

  <!-- Glowing Beating Heart of Forgiveness -->
  <g class="cnf-heart-float">
    <path d="M120 86C120 86 112 79 112 74.5C112 71.5 114.5 69 117.5 69C119 69 120 69.8 120 70.8C120 69.8 121 69 122.5 69C125.5 69 128 71.5 128 74.5C128 79 120 86 120 86Z" 
          fill="#FF5A7E" filter="url(#cnf-drop)" />
    <circle cx="117" cy="73" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Reconciling Hands Meeting in Peace at the Bottom -->
  <g class="cnf-hands-clasp" filter="url(#cnf-drop)">
    <!-- Left Arm & Hand Reaching -->
    <path d="M40 120L84 108C90 106 98 107 106 108L118 108C120 108 121 110 120 112L112 116C106 119 96 118 90 121L40 136V120Z" 
          fill="url(#cnf-hand-l)" stroke="#F5E6E8" stroke-width="1.2" />

    <!-- Right Arm & Hand Clasping -->
    <path d="M200 120L156 108C150 106 142 107 134 108L122 108C120 108 119 110 120 112L128 116C134 119 144 118 150 121L200 136V120Z" 
          fill="url(#cnf-hand-r)" stroke="#F5E6E8" stroke-width="1.2" />

    <!-- Clasping Center Touch Glow -->
    <circle cx="120" cy="110" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="120" cy="110" r="2.5" fill="#FF5A7E" />
  </g>

  <!-- Drifting Olive Leaves in the Breeze -->
  <g class="cnf-leaf-float-1" style="transform-origin: 50px 60px;">
    <ellipse cx="50" cy="60" rx="4" ry="2.2" fill="#4CA46F" transform="rotate(-20 50 60)" />
  </g>
  <g class="cnf-leaf-float-2" style="transform-origin: 190px 75px;">
    <ellipse cx="190" cy="75" rx="4.5" ry="2.5" fill="#73CD95" transform="rotate(35 190 75)" />
  </g>

  <!-- Twinkling Peace Stars -->
  <g class="cnf-star-1">
    <path d="M35 18V28M30 23H40" stroke="#FF5A7E" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="35" cy="23" r="1.2" fill="#FFFFFF" />
  </g>
  <g class="cnf-star-2">
    <path d="M205 18V28M200 23H210" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="205" cy="23" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
