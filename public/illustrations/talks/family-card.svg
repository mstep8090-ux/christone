<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Twilight Sky Gradient -->
    <linearGradient id="fam-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="45%" stop-color="#FFE0E8" />
      <stop offset="85%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Warm Hearth Halo -->
    <radialGradient id="fam-hearth-glow" cx="48%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFA726" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#FF5A7E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Roof Gradient -->
    <linearGradient id="fam-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A0" />
      <stop offset="40%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#D62850" />
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="fam-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#EEDDE0" />
    </linearGradient>

    <!-- Garden Grass Gradient -->
    <linearGradient id="fam-grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2E7C6" />
      <stop offset="50%" stop-color="#73CD95" />
      <stop offset="100%" stop-color="#3B8659" />
    </linearGradient>

    <filter id="fam-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5A7E" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .fam-sky-pulse {
      transform-origin: 120px 65px;
      animation: fam-glow-pulse 4s ease-in-out infinite alternate;
    }
    .fam-smoke-puff-1 {
      animation: fam-puff-float 3.5s ease-in-out infinite;
    }
    .fam-smoke-puff-2 {
      animation: fam-puff-float 3.5s ease-in-out infinite 1.2s;
    }
    .fam-smoke-puff-3 {
      animation: fam-puff-float 3.5s ease-in-out infinite 2.3s;
    }
    .fam-window-light {
      animation: fam-flicker 2.2s ease-in-out infinite alternate;
    }
    .fam-bird-group {
      transform-origin: 148px 46px;
      animation: fam-bird-bob 2.8s ease-in-out infinite;
    }
    .fam-garden-plants {
      transform-origin: 120px 130px;
      animation: fam-sway 3.6s ease-in-out infinite alternate;
    }
    .fam-star-1 {
      transform-origin: 40px 24px;
      animation: fam-twinkle 2.5s ease-in-out infinite;
    }
    .fam-star-2 {
      transform-origin: 205px 22px;
      animation: fam-twinkle 3s ease-in-out infinite 0.7s;
    }

    @keyframes fam-glow-pulse {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes fam-puff-float {
      0% { opacity: 0; transform: translateY(0px) scale(0.5) rotate(0deg); }
      30% { opacity: 0.9; }
      80% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-28px) translateX(12px) scale(1.3) rotate(15deg); }
    }
    @keyframes fam-flicker {
      0% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(255,167,38,0.5)); }
      100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,167,38,0.9)); }
    }
    @keyframes fam-bird-bob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      40% { transform: translateY(-2px) rotate(-3deg); }
      70% { transform: translateY(0px) rotate(2deg); }
    }
    @keyframes fam-sway {
      0% { transform: rotate(-1.5deg); }
      100% { transform: rotate(1.5deg); }
    }
    @keyframes fam-twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
  </style>

  <!-- Sky Canvas -->
  <rect width="240" height="140" fill="url(#fam-sky)" />

  <!-- Warm Hearth Atmosphere Glow -->
  <circle class="fam-sky-pulse" cx="120" cy="75" r="70" fill="url(#fam-hearth-glow)" />

  <!-- Crescent Moon in Sky -->
  <path d="M210 20C204 22 200 28 200 35C200 44 207 51 216 51C218 51 220 50.5 222 49.5C216 54 206 53 200 47C194 41 194 30 202 22C204 19.5 207 19 210 20Z" 
        fill="#FFD700" filter="url(#fam-drop)" />
  <circle cx="206" cy="30" r="1" fill="#FFFFFF" />

  <!-- Rolling Garden Hill Ground -->
  <path d="M-10 124C40 114 110 112 170 120C205 116 235 118 250 122V140H-10V124Z" fill="url(#fam-grass)" />

  <!-- Solid Storybook Cottage -->
  <!-- Cottage Main Wall Body -->
  <rect x="74" y="74" width="92" height="52" rx="6" fill="url(#fam-wall)" filter="url(#fam-drop)" stroke="#F5E6E8" stroke-width="1.5" />

  <!-- Stone Foundation Plinth -->
  <path d="M72 120H168V126C168 128 166 130 164 130H76C74 130 72 128 72 126V120Z" fill="#D9C3C7" />

  <!-- Brick Chimney -->
  <rect x="136" y="38" width="16" height="32" rx="3" fill="#D62850" filter="url(#fam-drop)" />
  <line x1="134" y1="38" x2="154" y2="38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <!-- Chimney Bricks Texture -->
  <rect x="139" y="44" width="5" height="3" fill="#FFF" fill-opacity="0.3" />
  <rect x="145" y="52" width="5" height="3" fill="#FFF" fill-opacity="0.3" />

  <!-- Animated Heart-Shaped Hearth Smoke Puffs -->
  <g class="fam-smoke-puff-1">
    <path d="M144 32C144 32 138 27 138 24C138 22 139.5 20.5 141.5 20.5C142.5 20.5 143.5 21.2 144 22C144.5 21.2 145.5 20.5 146.5 20.5C148.5 20.5 150 22 150 24C150 27 144 32 144 32Z" fill="#FFC2CE" />
  </g>
  <g class="fam-smoke-puff-2">
    <path d="M144 28C144 28 140 24 140 21.5C140 19.8 141.2 18.5 142.8 18.5C143.6 18.5 144.4 19.1 144.8 19.7C145.2 19.1 146 18.5 146.8 18.5C148.4 18.5 149.6 19.8 149.6 21.5C149.6 24 144 28 144 28Z" fill="#FF85A0" />
  </g>
  <g class="fam-smoke-puff-3">
    <circle cx="144" cy="22" r="3.5" fill="#FFE0E8" />
  </g>

  <!-- Big Charming Gabled Roof with Overhanging Eaves -->
  <path d="M62 76L120 34L178 76H166L120 42L74 76H62Z" fill="url(#fam-roof)" filter="url(#fam-drop)" />
  <!-- Under-eave Warm Shadow -->
  <path d="M74 76L120 42L166 76H158L120 48L82 76H74Z" fill="#800E26" fill-opacity="0.3" />

  <!-- Attic Faith Cross Window in Roof Triangle -->
  <circle cx="120" cy="58" r="9" fill="#FFFFFF" stroke="#FFC2CE" stroke-width="1.5" />
  <circle class="fam-window-light" cx="120" cy="58" r="7.5" fill="#FFE082" />
  <path d="M120 50V66M112 58H128" stroke="#E84367" stroke-width="1.5" stroke-linecap="round" />

  <!-- Luminous Arched Hearth Front Door -->
  <g class="fam-window-light">
    <!-- Golden Hearth Doorway -->
    <path d="M106 126V96C106 88 112 82 120 82C128 82 134 88 134 96V126H106Z" 
          fill="#FFE082" stroke="#FF5A7E" stroke-width="1.5" filter="url(#fam-drop)" />
    <!-- Inner Hearth Glow -->
    <path d="M110 126V98C110 92 114.5 87 120 87C125.5 87 130 92 130 98V126H110Z" fill="#FFA726" />
    <circle cx="128" cy="106" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Warm Side Windows with Panes -->
  <!-- Left Window -->
  <rect x="82" y="88" width="16" height="18" rx="3" fill="#FFE082" stroke="#FF5A7E" stroke-width="1.2" />
  <line x1="90" y1="88" x2="90" y2="106" stroke="#FF5A7E" stroke-width="1" />
  <line x1="82" y1="97" x2="98" y2="97" stroke="#FF5A7E" stroke-width="1" />

  <!-- Right Window -->
  <rect x="142" y="88" width="16" height="18" rx="3" fill="#FFE082" stroke="#FF5A7E" stroke-width="1.2" />
  <line x1="150" y1="88" x2="150" y2="106" stroke="#FF5A7E" stroke-width="1" />
  <line x1="142" y1="97" x2="158" y2="97" stroke="#FF5A7E" stroke-width="1" />

  <!-- Cute White Cartoon Songbird / Dove Perched on Roof Gable -->
  <g class="fam-bird-group">
    <!-- Bird Body -->
    <ellipse cx="148" cy="46" rx="6" ry="4.5" fill="#FFFFFF" filter="url(#fam-drop)" />
    <!-- Bird Wing -->
    <path d="M145 44C145 42 148 41 150 43C152 45 149 48 145 47Z" fill="#FFDCE3" />
    <!-- Bird Head -->
    <circle cx="153" cy="43" r="3.5" fill="#FFFFFF" />
    <circle cx="154" cy="42" r="0.9" fill="#1A1A1E" />
    <!-- Golden Beak -->
    <polygon points="156,43 159,44 156,45" fill="#FFD700" />
    <!-- Tail Feathers -->
    <path d="M142 47L138 49L143 45Z" fill="#FFFFFF" />
  </g>

  <!-- Animated Garden Flowers & Rose Bush at Gate -->
  <g class="fam-garden-plants">
    <!-- Left Flower Bush -->
    <circle cx="68" cy="122" r="7" fill="#73CD95" />
    <circle cx="68" cy="118" r="3" fill="#FF5A7E" />
    <circle cx="68" cy="118" r="1.2" fill="#FFFFFF" />

    <circle cx="58" cy="124" r="5" fill="#73CD95" />
    <circle cx="58" cy="122" r="2.5" fill="#FFA245" />

    <!-- Right Flower Bush -->
    <circle cx="172" cy="122" r="7" fill="#73CD95" />
    <circle cx="172" cy="118" r="3" fill="#FF5A7E" />
    <circle cx="172" cy="118" r="1.2" fill="#FFFFFF" />

    <circle cx="182" cy="124" r="5" fill="#73CD95" />
    <circle cx="182" cy="122" r="2.5" fill="#FFD700" />

    <!-- White Garden Picket Fence Post -->
    <rect x="94" y="118" width="4" height="12" rx="1" fill="#FFFFFF" stroke="#EEDDE0" stroke-width="0.8" />
    <polygon points="94,118 96,114 98,118" fill="#FFFFFF" stroke="#EEDDE0" stroke-width="0.8" />
    <rect x="142" y="118" width="4" height="12" rx="1" fill="#FFFFFF" stroke="#EEDDE0" stroke-width="0.8" />
    <polygon points="142,118 144,114 146,118" fill="#FFFFFF" stroke="#EEDDE0" stroke-width="0.8" />
  </g>

  <!-- Twinkling Celestial Stars -->
  <g class="fam-star-1">
    <path d="M40 18V28M35 23H45" stroke="#FF5A7E" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="40" cy="23" r="1.2" fill="#FFFFFF" />
  </g>
  <g class="fam-star-2">
    <circle cx="205" cy="22" r="1.6" fill="#FFD700" />
  </g>
</svg>
