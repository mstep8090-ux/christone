<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="mny-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6" />
      <stop offset="50%" stop-color="#FFF0F3" />
      <stop offset="85%" stop-color="#FFDCE3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Warm Golden Aura -->
    <radialGradient id="mny-sun-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFA245" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#FF5A7E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Rolling Hills Gradients -->
    <linearGradient id="mny-hill-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD6DF" />
      <stop offset="100%" stop-color="#F5C0CA" />
    </linearGradient>
    <linearGradient id="mny-hill-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFD6DF" />
    </linearGradient>

    <!-- Treasure Chest Body Gradient -->
    <linearGradient id="mny-chest-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3" />
      <stop offset="30%" stop-color="#FFD6DF" />
      <stop offset="70%" stop-color="#FF85A0" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="mny-gold-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFCE6" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#FFA245" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <!-- Emerald Sprout Gradient -->
    <linearGradient id="mny-sprout-leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A3E8BC" />
      <stop offset="60%" stop-color="#4CA46F" />
      <stop offset="100%" stop-color="#2D6B45" />
    </linearGradient>

    <filter id="mny-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5A7E" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mny-sun-pulse {
      transform-origin: 120px 50px;
      animation: mny-glow-pulse 4s ease-in-out infinite alternate;
    }
    .mny-sprout-group {
      transform-origin: 120px 80px;
      animation: mny-sprout-dance 3.2s ease-in-out infinite;
    }
    .mny-sprout-blink {
      animation: mny-blink 4s infinite;
      transform-origin: 120px 65px;
    }
    .mny-coin-float-1 {
      transform-origin: 65px 65px;
      animation: mny-coin-bob-1 3.5s ease-in-out infinite;
    }
    .mny-coin-float-2 {
      transform-origin: 175px 60px;
      animation: mny-coin-bob-2 4s ease-in-out infinite 0.6s;
    }
    .mny-coin-shimmer {
      animation: mny-sheen 2.5s ease-in-out infinite alternate;
    }
    .mny-star-1 {
      transform-origin: 40px 25px;
      animation: mny-twinkle 2.6s ease-in-out infinite;
    }
    .mny-star-2 {
      transform-origin: 200px 30px;
      animation: mny-twinkle 3s ease-in-out infinite 0.8s;
    }

    @keyframes mny-glow-pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes mny-sprout-dance {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(3deg); }
      75% { transform: translateY(-2px) rotate(-3deg); }
    }
    @keyframes mny-blink {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes mny-coin-bob-1 {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-5px) rotate(4deg); }
    }
    @keyframes mny-coin-bob-2 {
      0%, 100% { transform: translateY(0px) rotate(6deg); }
      50% { transform: translateY(-6px) rotate(-4deg); }
    }
    @keyframes mny-sheen {
      0% { opacity: 0.6; filter: drop-shadow(0 0 2px rgba(255,215,0,0.4)); }
      100% { opacity: 1; filter: drop-shadow(0 0 7px rgba(255,215,0,0.9)); }
    }
    @keyframes mny-twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
  </style>

  <!-- Sky Canvas -->
  <rect width="240" height="140" fill="url(#mny-sky)" />

  <!-- Heavenly Golden Sun Halo -->
  <circle class="mny-sun-pulse" cx="120" cy="50" r="75" fill="url(#mny-sun-glow)" />

  <!-- Background Pastel Rolling Hills of Grace -->
  <path d="M-20 110C30 95 90 98 140 112C180 102 220 105 260 115V140H-20V110Z" fill="url(#mny-hill-back)" opacity="0.6" />
  <path d="M-10 120C40 110 100 114 160 125C200 118 230 122 250 126V140H-10V120Z" fill="url(#mny-hill-front)" />

  <!-- Floating Golden Kingdom Coin Left -->
  <g class="mny-coin-float-1" filter="url(#mny-drop)">
    <circle cx="65" cy="65" r="14" fill="url(#mny-gold-coin)" />
    <circle cx="65" cy="65" r="11" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-opacity="0.8" />
    <path d="M65 58V72M60 63H70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <circle cx="65" cy="63" r="1" fill="#FFD700" />
    <!-- Shiny glint -->
    <polygon points="56,58 58,62 55,60" fill="#FFFFFF" />
  </g>

  <!-- Floating Golden Kingdom Coin Right -->
  <g class="mny-coin-float-2" filter="url(#mny-drop)">
    <circle cx="175" cy="60" r="15" fill="url(#mny-gold-coin)" />
    <circle cx="175" cy="60" r="12" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-opacity="0.8" />
    <path d="M175 52V68M169 58H181" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="175" cy="58" r="1.2" fill="#FFD700" />
    <polygon points="183,53 185,57 181,55" fill="#FFFFFF" />
  </g>

  <!-- Solid 3D Kingdom Treasure Coffer / Chest -->
  <!-- Chest Base Tub -->
  <path d="M72 88H168L160 126C160 129 157 131 153 131H87C83 131 80 129 80 126L72 88Z" 
        fill="url(#mny-chest-wood)" filter="url(#mny-drop)" />

  <!-- Polished Rose Gold Straps & Studs -->
  <path d="M96 88L98 131M144 88L142 131" stroke="#FFD700" stroke-width="3" />
  <circle cx="97" cy="94" r="1.5" fill="#FFFFFF" />
  <circle cx="97.5" cy="118" r="1.5" fill="#FFFFFF" />
  <circle cx="143" cy="94" r="1.5" fill="#FFFFFF" />
  <circle cx="142.5" cy="118" r="1.5" fill="#FFFFFF" />

  <!-- Top Open Chest Rim -->
  <line x1="70" y1="88" x2="170" y2="88" stroke="#FFA245" stroke-width="3.5" stroke-linecap="round" />
  <line x1="72" y1="87" x2="168" y2="87" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Arched Open Lid Reclined in Background -->
  <path d="M68 88C68 68 85 58 120 58C155 58 172 68 172 88H68Z" fill="#FFDCE3" stroke="#FF85A0" stroke-width="2" />
  <path d="M74 88C74 72 89 63 120 63C151 63 166 72 166 88H74Z" fill="#FFF0F3" />

  <!-- Overflowing Gold Coins Mountain Inside Chest -->
  <g class="mny-coin-shimmer">
    <!-- Coin Pile Base -->
    <ellipse cx="120" cy="88" rx="42" ry="14" fill="url(#mny-gold-coin)" />
    <!-- Individual Overlapping Coins -->
    <ellipse cx="94" cy="86" rx="9" ry="5.5" fill="#FFD700" stroke="#FFF" stroke-width="0.8" />
    <ellipse cx="146" cy="86" rx="9" ry="5.5" fill="#FFD700" stroke="#FFF" stroke-width="0.8" />
    <ellipse cx="108" cy="84" rx="10" ry="6" fill="#FFE082" stroke="#FFF" stroke-width="0.8" />
    <ellipse cx="132" cy="84" rx="10" ry="6" fill="#FFE082" stroke="#FFF" stroke-width="0.8" />
    <ellipse cx="120" cy="82" rx="12" ry="7" fill="#FFFCE6" stroke="#FFA245" stroke-width="1" />
    <circle cx="120" cy="82" r="2.5" fill="#FF5A7E" />
  </g>

  <!-- Heart Padlock on Front of Coffer -->
  <path d="M120 98C120 98 114 92 114 89C114 87 115.5 85.5 117.5 85.5C118.5 85.5 119.5 86.2 120 87C120.5 86.2 121.5 85.5 122.5 85.5C124.5 85.5 126 87 126 89C126 92 120 98 120 98Z" 
        fill="#FF5A7E" filter="url(#mny-drop)" />
  <circle cx="120" cy="89" r="1" fill="#FFFFFF" />

  <!-- Animated Living Cartoon Sprout of Generosity -->
  <g class="mny-sprout-group">
    <!-- Tender Curving Stem -->
    <path d="M120 84C120 74 119 58 120 48" stroke="url(#mny-sprout-leaf)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left Heart-Shaped Emerald Leaf -->
    <path d="M120 60C110 52 102 58 104 68C112 68 118 64 120 60Z" 
          fill="url(#mny-sprout-leaf)" filter="url(#mny-drop)" />
    <!-- Leaf Vein Highlight -->
    <path d="M106 66C112 65 116 63 119 61" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Right Heart-Shaped Emerald Leaf -->
    <path d="M120 54C130 46 138 52 136 62C128 62 122 58 120 54Z" 
          fill="url(#mny-sprout-leaf)" filter="url(#mny-drop)" />
    <path d="M134 60C128 59 124 57 121 55" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Top Sprout Bud Head with Dewdrop Cap -->
    <circle cx="120" cy="46" r="6" fill="#A3E8BC" />
    <circle cx="120" cy="42" r="3" fill="#FFFFFF" fill-opacity="0.8" />

    <!-- Cute Smiling Cartoon Sprout Face -->
    <g class="mny-sprout-blink">
      <!-- Left Eye -->
      <ellipse cx="118" cy="46" rx="1.2" ry="1.8" fill="#1A1A1E" />
      <circle cx="117.5" cy="45.5" r="0.6" fill="#FFFFFF" />
      <!-- Right Eye -->
      <ellipse cx="122" cy="46" rx="1.2" ry="1.8" fill="#1A1A1E" />
      <circle cx="121.5" cy="45.5" r="0.6" fill="#FFFFFF" />
    </g>
    <!-- Rosy Cheek Blushes -->
    <circle cx="116" cy="48" r="1.2" fill="#FF5A7E" fill-opacity="0.7" />
    <circle cx="124" cy="48" r="1.2" fill="#FF5A7E" fill-opacity="0.7" />
    <!-- Happy Smile -->
    <path d="M119 48.5C119.5 49.5 120.5 49.5 121 48.5" stroke="#1A1A1E" stroke-width="0.9" stroke-linecap="round" fill="none" />
  </g>

  <!-- Twinkling Kingdom Stars in Sky -->
  <g class="mny-star-1">
    <path d="M40 18V30M34 24H46" stroke="#FF5A7E" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="40" cy="24" r="1.3" fill="#FFD700" />
  </g>
  <g class="mny-star-2">
    <path d="M200 24V36M194 30H206" stroke="#FFA245" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="200" cy="30" r="1.3" fill="#FFFFFF" />
  </g>
</svg>
