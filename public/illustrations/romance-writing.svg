<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft pink background #FFF5F7 -->
  <rect width="200" height="200" rx="24" fill="#FFF5F7"/>
  
  <!-- Subtle background glow -->
  <circle cx="100" cy="100" r="60" fill="#FFC2CE" fill-opacity="0.25"/>

  <!-- Table surface -->
  <line x1="28" y1="148" x2="172" y2="148" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Love Letter / Note Left -->
  <rect x="58" y="132" width="28" height="16" rx="2" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5" transform="rotate(-6 58 132)"/>
  <line x1="62" y1="138" x2="80" y2="136" stroke="#FF5A7E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="63" y1="142" x2="76" y2="140.5" stroke="#FF5A7E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Love Letter / Note Right -->
  <rect x="114" y="130" width="28" height="16" rx="2" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="1.5" transform="rotate(6 114 130)"/>
  <line x1="120" y1="135" x2="138" y2="137" stroke="#FF5A7E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="121" y1="139" x2="134" y2="140.5" stroke="#FF5A7E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Little heart in middle of table -->
  <path d="M100 134C98 130 93 130 91 133C88 137 100 144 100 144C100 144 112 137 109 133C107 130 102 130 100 134Z" fill="#FF5A7E"/>

  <!-- Partner Left (Woman writing) -->
  <circle cx="70" cy="74" r="13" stroke="#1A1A1E" stroke-width="1.5" fill="#FFFFFF"/>
  <!-- Hair bun -->
  <circle cx="61" cy="71" r="6" fill="#1A1A1E"/>
  <!-- Torso & shoulder -->
  <path d="M70 87C62 90 56 100 54 122C54 134 56 148 56 148H80V128" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/>
  <!-- Arm writing with pen -->
  <path d="M70 102L84 130" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M84 128L88 135" stroke="#FF5A7E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Partner Right (Man writing) -->
  <circle cx="130" cy="70" r="13" stroke="#1A1A1E" stroke-width="1.5" fill="#FFFFFF"/>
  <!-- Short hair -->
  <path d="M119 70C119 62 124 58 132 58C140 58 143 63 143 70" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Torso & shoulder -->
  <path d="M130 83C138 87 144 97 146 118C146 132 144 148 144 148H120V128" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/>
  <!-- Arm writing with pen -->
  <path d="M130 98L116 128" stroke="#1A1A1E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M116 126L112 133" stroke="#FF5A7E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top delicate hearts connecting them -->
  <path d="M100 68C98 64 94 64 92 66.5C89.5 70 100 76.5 100 76.5C100 76.5 110.5 70 108 66.5C106 64 102 64 100 68Z" fill="#FFC2CE"/>
</svg>
