<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="rw-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFDCE3" />
    </radialGradient>

    <!-- Celestial Moon / Blessing Halo -->
    <radialGradient id="rw-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF5F7" />
      <stop offset="80%" stop-color="#FFC2CE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF5A7E" stop-opacity="0" />
    </radialGradient>

    <!-- Couple Gradients -->
    <linearGradient id="rw-woman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A0" />
      <stop offset="50%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <linearGradient id="rw-man" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D292F" />
      <stop offset="60%" stop-color="#1A1A1E" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <linearGradient id="rw-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEE8E8" />
      <stop offset="100%" stop-color="#F6B8C2" />
    </linearGradient>

    <!-- Cobblestone Path Gradient -->
    <linearGradient id="rw-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE2E4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFC2CE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EFE2E4" stop-opacity="0.3" />
    </linearGradient>

    <filter id="rw-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF5A7E" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    .rw-couple-walk {
      transform-origin: 100px 160px;
      animation: rw-walk-motion 3.6s ease-in-out infinite;
    }
    .rw-hand-glow {
      transform-origin: 100px 108px;
      animation: rw-pulse-glow 2.2s ease-in-out infinite;
    }
    .rw-star-top {
      transform-origin: 100px 32px;
      animation: rw-twinkle 2.5s ease-in-out infinite;
    }
    .rw-petal-1 {
      animation: rw-float-petal 4s ease-in-out infinite;
    }
    .rw-petal-2 {
      animation: rw-float-petal 5s ease-in-out infinite 1.5s;
    }

    @keyframes rw-walk-motion {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-2.5px) rotate(0.6deg); }
      75% { transform: translateY(-2.5px) rotate(-0.6deg); }
    }
    @keyframes rw-pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,90,126,0.4)); }
      50% { transform: scale(1.22); filter: drop-shadow(0 0 7px rgba(255,90,126,0.9)); }
    }
    @keyframes rw-twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
    @keyframes rw-float-petal {
      0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
      30% { opacity: 0.8; }
      80% { opacity: 0.5; }
      100% { opacity: 0; transform: translate(30px, 40px) rotate(120deg); }
    }
  </style>

  <!-- Card Background -->
  <rect width="200" height="200" rx="28" fill="url(#rw-bg)" stroke="#F5E6E8" stroke-width="1.5" />
  <circle cx="100" cy="50" r="50" fill="url(#rw-moon)" />

  <!-- Covenant Pathway with Stepping Stones -->
  <path d="M20 168C60 162 140 162 180 168" stroke="url(#rw-path)" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="60" cy="167" rx="10" ry="3" fill="#FFFFFF" fill-opacity="0.8" />
  <ellipse cx="100" cy="168" rx="12" ry="3.5" fill="#FFFFFF" fill-opacity="0.9" />
  <ellipse cx="140" cy="167" rx="10" ry="3" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Animated Couple Walking Group -->
  <g class="rw-couple-walk">
    <!-- Partner Left (Woman) -->
    <!-- Head & Chignon Hair -->
    <circle cx="72" cy="52" r="5" fill="#1A1A1E" />
    <circle cx="80" cy="58" r="10" fill="url(#rw-skin)" />
    <!-- Hair Front & Flower -->
    <path d="M72 58C71 50 76 46 84 46C89 46 91 50 90 56C87 53 82 52 77 53Z" fill="#1A1A1E" />
    <circle cx="74" cy="53" r="2.8" fill="#FF5A7E" />

    <!-- Flowing Maxi Dress -->
    <path d="M80 68C72 72 68 84 68 106C68 126 62 150 62 160H94C94 150 90 126 90 106C90 84 86 72 80 68Z" 
          fill="url(#rw-woman)" />
    <!-- Soft Dress Swirl Shadow & Highlight -->
    <path d="M78 88C78 110 74 135 72 160H82C84 135 86 110 86 88Z" fill="#FFFFFF" fill-opacity="0.18" />

    <!-- Arm reaching to hold his hand -->
    <path d="M84 82C90 92 94 100 98 108" stroke="url(#rw-skin)" stroke-width="5" stroke-linecap="round" />

    <!-- Partner Right (Man) -->
    <!-- Head & Sculpted Hair -->
    <circle cx="120" cy="54" r="10" fill="url(#rw-skin)" />
    <path d="M110 54C110 46 115 42 122 42C129 42 131 46 131 54C128 50 124 49 120 49C115 49 112 51 110 54Z" fill="url(#rw-man)" />

    <!-- Tailored Blazer & Shoulders -->
    <path d="M120 64C128 68 134 76 134 94C134 110 132 124 132 124H110V94" fill="url(#rw-man)" />
    <!-- Trousers -->
    <path d="M112 124L111 160H119L120 124" fill="#1A1A1E" />
    <path d="M123 124L124 160H131L130 124" fill="#1A1A1E" />

    <!-- Arm reaching to hold her hand -->
    <path d="M116 80C110 90 106 100 102 108" stroke="url(#rw-skin)" stroke-width="5" stroke-linecap="round" />

    <!-- Clasping Hands with Radiant Covenant Spark -->
    <g class="rw-hand-glow">
      <circle cx="100" cy="108" r="6" fill="#FF5A7E" />
      <circle cx="100" cy="108" r="3" fill="#FFFFFF" />
      <!-- Tiny Heart atop clasped hands -->
      <path d="M100 98C98.5 95 94.5 95 93 97.5C91 101 100 106 100 106C100 106 109 101 107 97.5C105.5 95 101.5 95 100 98Z" fill="#E84367" />
    </g>
  </g>

  <!-- Drifting Petals in the Evening Breeze -->
  <g class="rw-petal-1" style="transform-origin: 40px 80px;">
    <ellipse cx="40" cy="80" rx="3.5" ry="2" fill="#FF85A0" transform="rotate(-30 40 80)" />
  </g>
  <g class="rw-petal-2" style="transform-origin: 155px 70px;">
    <ellipse cx="155" cy="70" rx="4" ry="2.2" fill="#FFC2CE" transform="rotate(40 155 70)" />
  </g>

  <!-- Holy Light Cross & Twinkle Overhead -->
  <g class="rw-star-top">
    <path d="M100 24V34M95 29H105" stroke="#FF5A7E" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="100" cy="29" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
