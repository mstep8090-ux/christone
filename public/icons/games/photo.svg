<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Halo Glow -->
    <radialGradient id="pht-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#FFC2CE" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>

    <!-- Disc Gradient -->
    <radialGradient id="pht-disc" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFD6DF" />
    </radialGradient>

    <!-- Camera Body Gradient -->
    <linearGradient id="pht-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFDCE3" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <radialGradient id="pht-lens" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FF85A0" />
      <stop offset="75%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#A81D3E" />
    </radialGradient>

    <filter id="pht-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#FF5A7E" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .pht-aura {
      transform-origin: 24px 24px;
      animation: pht-pulse 3.2s ease-in-out infinite;
    }
    .pht-cam-group {
      transform-origin: 24px 26px;
      animation: pht-float 3.6s ease-in-out infinite;
    }
    .pht-flash-beam {
      transform-origin: 32px 17px;
      animation: pht-flash-anim 2s ease-in-out infinite;
    }
    .pht-lens-iris {
      transform-origin: 24px 27px;
      animation: pht-iris-breathe 2.4s ease-in-out infinite;
    }
    .pht-star {
      transform-origin: 39px 10px;
      animation: pht-twinkle 2.6s ease-in-out infinite;
    }

    @keyframes pht-pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.05); }
    }
    @keyframes pht-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(1deg); }
    }
    @keyframes pht-flash-anim {
      0%, 75% { opacity: 0; transform: scale(0.5); }
      80% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #FFFFFF); }
      90% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.5); }
    }
    @keyframes pht-iris-breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,90,126,0.3)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 6px rgba(255,90,126,0.8)); }
    }
    @keyframes pht-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
    }
  </style>

  <!-- Ambient Glow -->
  <circle class="pht-aura" cx="24" cy="24" r="23" fill="url(#pht-bg)" />

  <!-- Solid Badge Disc -->
  <circle cx="24" cy="24" r="21" fill="url(#pht-disc)" stroke="#F5E6E8" stroke-width="1.2" filter="url(#pht-shadow)" />

  <!-- Animated Camera -->
  <g class="pht-cam-group">
    <!-- Camera Viewfinder Bump -->
    <path d="M19 19L21 16H27L29 19H19Z" fill="#E84367" />

    <!-- Shutter Button -->
    <rect x="14" y="17" width="4" height="2" rx="1" fill="#FF5A7E" />

    <!-- Camera Body Base -->
    <rect x="10" y="19" width="28" height="18" rx="5" fill="url(#pht-body)" stroke="#F5E6E8" stroke-width="1.2" filter="url(#pht-shadow)" />

    <!-- Rose Accent Strip across body -->
    <rect x="10" y="23" width="28" height="3" fill="#FFC2CE" fill-opacity="0.4" />

    <!-- Solid Camera Optical Lens -->
    <circle cx="24" cy="28" r="8" fill="#FFFFFF" stroke="#EAD6DA" stroke-width="1" />
    <circle class="pht-lens-iris" cx="24" cy="28" r="6" fill="url(#pht-lens)" />
    <!-- Lens Specular Glint -->
    <circle cx="22" cy="26" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="26" cy="30" r="0.8" fill="#FFFFFF" fill-opacity="0.6" />

    <!-- Camera Flash Element (Top Right) -->
    <circle cx="33" cy="22" r="2" fill="#FFFFFF" stroke="#FF5A7E" stroke-width="0.8" />

    <!-- Dynamic Camera Flash Burst -->
    <g class="pht-flash-beam">
      <polygon points="33,16 34.5,20.5 39,22 34.5,23.5 33,28 31.5,23.5 27,22 31.5,20.5" fill="#FFFFFF" />
      <circle cx="33" cy="22" r="2" fill="#FFD700" />
    </g>
  </g>

  <!-- Twinkling Celestial Star -->
  <path class="pht-star" d="M39 7V13M36 10H42" stroke="#FF5A7E" stroke-width="1.2" stroke-linecap="round" />
</svg>
