<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Halo Glow -->
    <radialGradient id="phi-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#FFC2CE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>

    <!-- Disc Gradient -->
    <radialGradient id="phi-disc" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFD6DF" />
    </radialGradient>

    <!-- Hands Solid Gradient Left & Right -->
    <linearGradient id="phi-hand-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFD6DF" />
      <stop offset="100%" stop-color="#FF85A0" />
    </linearGradient>
    <linearGradient id="phi-hand-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFC2CE" />
      <stop offset="100%" stop-color="#FF5A7E" />
    </linearGradient>

    <filter id="phi-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#FF5A7E" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .phi-aura {
      transform-origin: 24px 24px;
      animation: phi-pulse 3.2s ease-in-out infinite;
    }
    .phi-hands-group {
      transform-origin: 24px 26px;
      animation: phi-float 3.6s ease-in-out infinite;
    }
    .phi-ray-1 {
      animation: phi-ray-glow 2.5s ease-in-out infinite;
    }
    .phi-ray-2 {
      animation: phi-ray-glow 2.5s ease-in-out infinite 0.6s;
    }
    .phi-star {
      transform-origin: 38px 10px;
      animation: phi-twinkle 2.8s ease-in-out infinite;
    }

    @keyframes phi-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes phi-pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.05); }
    }
    @keyframes phi-ray-glow {
      0%, 100% { opacity: 0.3; transform: scaleY(0.85); }
      50% { opacity: 1; transform: scaleY(1.15); }
    }
    @keyframes phi-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
    }
  </style>

  <!-- Ambient Glow -->
  <circle class="phi-aura" cx="24" cy="24" r="23" fill="url(#phi-bg)" />

  <!-- Solid Badge Disc -->
  <circle cx="24" cy="24" r="21" fill="url(#phi-disc)" stroke="#F5E6E8" stroke-width="1.2" filter="url(#phi-shadow)" />

  <!-- Animated Praying Hands -->
  <g class="phi-hands-group">
    <!-- Holy Light Beams Ascending from Palms -->
    <path class="phi-ray-1" d="M24 7V4" stroke="#FF5A7E" stroke-width="1.6" stroke-linecap="round" />
    <path class="phi-ray-2" d="M20 9L18 6" stroke="#FF85A0" stroke-width="1.3" stroke-linecap="round" />
    <path class="phi-ray-2" d="M28 9L30 6" stroke="#FF85A0" stroke-width="1.3" stroke-linecap="round" />

    <!-- Left Praying Hand -->
    <path d="M24 10C24 10 21 12 19 16C17 20 16 26 16 34C16 36 17.5 37 19.5 37H24V10Z" 
          fill="url(#phi-hand-l)" filter="url(#phi-shadow)" />
    <!-- Left Fingers Ridge Line -->
    <path d="M21 18C19 22 18.5 27 18.5 33" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Right Praying Hand -->
    <path d="M24 10C24 10 27 12 29 16C31 20 32 26 32 34C32 36 30.5 37 28.5 37H24V10Z" 
          fill="url(#phi-hand-r)" />
    <!-- Right Fingers Ridge Line -->
    <path d="M27 18C29 22 29.5 27 29.5 33" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Center Seam Highlight & Holy Light -->
    <line x1="24" y1="10" x2="24" y2="37" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

    <!-- Cuff / Sleeve Base -->
    <path d="M16 35H32V38C32 39 31 40 30 40H18C17 40 16 39 16 38V35Z" fill="#1A1A1E" />
    <line x1="16" y1="35" x2="32" y2="35" stroke="#FF5A7E" stroke-width="1" />
  </g>

  <!-- Celestial Twinkle -->
  <path class="phi-star" d="M38 7V13M35 10H41" stroke="#FF5A7E" stroke-width="1.2" stroke-linecap="round" />
</svg>
