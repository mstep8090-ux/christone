<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Halo Glow -->
    <radialGradient id="fun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#FFC2CE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>

    <!-- Disc Gradient -->
    <radialGradient id="fun-disc" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF0F3" />
      <stop offset="85%" stop-color="#FFD6DF" />
      <stop offset="100%" stop-color="#FFC2CE" />
    </radialGradient>

    <!-- Wand Gradient -->
    <linearGradient id="fun-wand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A7E" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Star Burst Gradient -->
    <radialGradient id="fun-star-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#E84367" />
    </radialGradient>

    <filter id="fun-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#FF5A7E" flood-opacity="0.28" />
    </filter>
  </defs>

  <style>
    .fun-aura {
      transform-origin: 60px 60px;
      animation: fun-pulse 3.5s ease-in-out infinite;
    }
    .fun-wand-group {
      transform-origin: 35px 85px;
      animation: fun-wave 3s ease-in-out infinite;
    }
    .fun-burst-main {
      transform-origin: 68px 48px;
      animation: fun-burst 2s ease-in-out infinite;
    }
    .fun-particle-1 {
      animation: fun-pop 2.4s ease-in-out infinite;
    }
    .fun-particle-2 {
      animation: fun-pop 2.4s ease-in-out infinite 0.7s;
    }
    .fun-particle-3 {
      animation: fun-pop 2.4s ease-in-out infinite 1.4s;
    }

    @keyframes fun-pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes fun-wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg) translateY(-2px); }
    }
    @keyframes fun-burst {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 2px rgba(255,215,0,0.5)); }
      50% { transform: scale(1.18) rotate(15deg); filter: drop-shadow(0 0 10px rgba(255,90,126,0.9)); }
    }
    @keyframes fun-pop {
      0%, 100% { opacity: 0.3; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- Ambient Halo -->
  <circle class="fun-aura" cx="60" cy="60" r="56" fill="url(#fun-glow)" />

  <!-- Solid Badge Disc -->
  <circle cx="60" cy="60" r="52" fill="url(#fun-disc)" stroke="#F5E6E8" stroke-width="2" filter="url(#fun-shadow)" />
  <circle cx="60" cy="60" r="47" stroke="#FF5A7E" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4" fill="none" />

  <!-- Animated Sparkler / Wand -->
  <g class="fun-wand-group">
    <!-- Solid Wand Shaft with Metallic Gradient -->
    <path d="M30 92L64 52" stroke="url(#fun-wand)" stroke-width="5" stroke-linecap="round" filter="url(#fun-shadow)" />
    <path d="M30 92L64 52" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Wand Grip Ring -->
    <circle cx="34" cy="87" r="3.5" fill="#E84367" />
  </g>

  <!-- Celebratory Starburst of Joy & Laughter -->
  <g class="fun-burst-main">
    <!-- Central Brilliant 8-Point Diamond Star -->
    <path d="M68 34L71 44L81 41L74 48L82 54L71 53L68 64L64 54L54 55L61 48L55 41L64 43Z" 
          fill="url(#fun-star-grad)" filter="url(#fun-shadow)" />
    <!-- Center Jewel Gleam -->
    <circle cx="68" cy="48" r="3" fill="#FFFFFF" />
  </g>

  <!-- Exploding Celebratory Sparkles & Joy Particles -->
  <g class="fun-particle-1" style="transform-origin: 86px 36px;">
    <!-- Top-Right Star Sparkle -->
    <path d="M86 30V42M80 36H92" stroke="#FF5A7E" stroke-width="2" stroke-linecap="round" />
    <circle cx="86" cy="36" r="1.5" fill="#FFD700" />
  </g>

  <g class="fun-particle-2" style="transform-origin: 50px 32px;">
    <!-- Top-Left Star Sparkle -->
    <path d="M50 28V38M45 33H55" stroke="#FFA245" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="50" cy="33" r="1.2" fill="#FFFFFF" />
  </g>

  <g class="fun-particle-3" style="transform-origin: 82px 68px;">
    <!-- Bottom-Right Joyful Heart Confetti -->
    <path d="M82 68C81 66 78 66 77 67.5C75 70 82 74 82 74C82 74 89 70 87 67.5C86 66 83 66 82 68Z" fill="#FF5A7E" />
    <circle cx="48" cy="62" r="2" fill="#FFD700" />
  </g>
</svg>
