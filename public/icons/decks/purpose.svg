<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Halo Glow -->
    <radialGradient id="pur-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#FFC2CE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>

    <!-- Disc Gradient -->
    <radialGradient id="pur-disc" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF0F3" />
      <stop offset="85%" stop-color="#FFD6DF" />
      <stop offset="100%" stop-color="#FFC2CE" />
    </radialGradient>

    <!-- Compass Dial Metallic Gradient -->
    <linearGradient id="pur-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="35%" stop-color="#FFD6DF" />
      <stop offset="70%" stop-color="#FF85A0" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <!-- North Needle Gradient -->
    <linearGradient id="pur-needle-n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A0" />
      <stop offset="50%" stop-color="#FF5A7E" />
      <stop offset="100%" stop-color="#E84367" />
    </linearGradient>

    <filter id="pur-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#FF5A7E" flood-opacity="0.28" />
    </filter>
  </defs>

  <style>
    .pur-aura {
      transform-origin: 60px 60px;
      animation: pur-pulse 3.5s ease-in-out infinite;
    }
    .pur-compass {
      transform-origin: 60px 60px;
      animation: pur-float 4s ease-in-out infinite;
    }
    .pur-needle-group {
      transform-origin: 60px 60px;
      animation: pur-needle-sway 4s ease-in-out infinite;
    }
    .pur-star-center {
      transform-origin: 60px 60px;
      animation: pur-star-shimmer 2s ease-in-out infinite;
    }
    .pur-twinkle {
      transform-origin: 96px 24px;
      animation: pur-twinkle-anim 2.5s ease-in-out infinite;
    }

    @keyframes pur-pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes pur-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes pur-needle-sway {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(4deg); }
    }
    @keyframes pur-star-shimmer {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,90,126,0.4)); }
      50% { transform: scale(1.2); filter: drop-shadow(0 0 7px rgba(255,90,126,0.9)); }
    }
    @keyframes pur-twinkle-anim {
      0%, 100% { opacity: 0.25; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
  </style>

  <!-- Ambient Halo -->
  <circle class="pur-aura" cx="60" cy="60" r="56" fill="url(#pur-glow)" />

  <!-- Solid Badge Disc -->
  <circle cx="60" cy="60" r="52" fill="url(#pur-disc)" stroke="#F5E6E8" stroke-width="2" filter="url(#pur-shadow)" />

  <!-- Animated Compass Group -->
  <g class="pur-compass">
    <!-- Outer Bezel Ring -->
    <circle cx="60" cy="60" r="38" fill="url(#pur-gold)" stroke="#FFFFFF" stroke-width="2" filter="url(#pur-shadow)" />
    <!-- Inner Dial Face -->
    <circle cx="60" cy="60" r="32" fill="#FFFFFF" stroke="#F5E6E8" stroke-width="1.5" />
    <circle cx="60" cy="60" r="28" stroke="#FF5A7E" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" fill="none" />

    <!-- Cardinal Degree Ticks -->
    <line x1="60" y1="29" x2="60" y2="33" stroke="#FF5A7E" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="87" x2="60" y2="91" stroke="#6B5B5F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="29" y1="60" x2="33" y2="60" stroke="#6B5B5F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="87" y1="60" x2="91" y2="60" stroke="#6B5B5F" stroke-width="1.5" stroke-linecap="round" />

    <!-- "N" For North Heading -->
    <text x="60" y="27" font-family="sans-serif" font-size="7" font-weight="bold" fill="#E84367" text-anchor="middle">N</text>

    <!-- Swaying Living Needle -->
    <g class="pur-needle-group">
      <!-- North Pointer (Vibrant Rose) -->
      <polygon points="60,33 65,60 60,56" fill="url(#pur-needle-n)" filter="url(#pur-shadow)" />
      <polygon points="60,33 55,60 60,56" fill="#FF85A0" />

      <!-- South Pointer (Silver/Ink Soft) -->
      <polygon points="60,87 65,60 60,64" fill="#D4BEC3" />
      <polygon points="60,87 55,60 60,64" fill="#EFE2E4" />

      <!-- Central Pivot Cross Jewel -->
      <circle cx="60" cy="60" r="6" fill="#FFFFFF" stroke="#FF5A7E" stroke-width="1.5" />
      <circle class="pur-star-center" cx="60" cy="60" r="3" fill="#FF5A7E" />
    </g>
  </g>

  <!-- Twinkling North Star -->
  <g class="pur-twinkle">
    <path d="M96 19V29M91 24H101" stroke="#FF5A7E" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="96" cy="24" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
