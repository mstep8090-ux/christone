<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Halo Glow -->
    <radialGradient id="hi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A7E" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FFC2CE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFBFC" stop-opacity="0" />
    </radialGradient>

    <!-- Solid 3D Heart Gradient -->
    <radialGradient id="hi-heart" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFA4B8" />
      <stop offset="55%" stop-color="#FF5A7E" />
      <stop offset="85%" stop-color="#E84367" />
      <stop offset="100%" stop-color="#A81D3E" />
    </radialGradient>

    <!-- Edge Rim Specular Highlight -->
    <linearGradient id="hi-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF5A7E" stop-opacity="0.3" />
    </linearGradient>

    <filter id="hi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5A7E" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .hi-aura-pulse {
      transform-origin: 24px 24px;
      animation: hi-pulse-glow 2.8s ease-in-out infinite;
    }
    .hi-heart-group {
      transform-origin: 24px 24px;
      animation: hi-heartbeat 1.8s ease-in-out infinite;
    }
    .hi-star {
      transform-origin: 38px 12px;
      animation: hi-twinkle 2.4s ease-in-out infinite;
    }

    @keyframes hi-pulse-glow {
      0%, 100% { opacity: 0.5; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.06); }
    }
    @keyframes hi-heartbeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,90,126,0.3)); }
      18% { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(255,90,126,0.9)); }
      36% { transform: scale(1.04); filter: drop-shadow(0 0 3px rgba(255,90,126,0.4)); }
      54% { transform: scale(1.11); filter: drop-shadow(0 0 6px rgba(255,90,126,0.7)); }
      75% { transform: scale(1); }
    }
    @keyframes hi-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }
  </style>

  <!-- Ambient Light Halo -->
  <circle class="hi-aura-pulse" cx="24" cy="24" r="23" fill="url(#hi-glow)" />

  <!-- Animated Beating Solid Heart -->
  <g class="hi-heart-group" filter="url(#hi-shadow)">
    <!-- Solid 3D Sculpted Heart -->
    <path d="M24 39.5C24 39.5 8 28.5 8 17.5C8 12 12 8 17 8C20.2 8 22.8 9.8 24 12.2C25.2 9.8 27.8 8 31 8C36 8 40 12 40 17.5C40 28.5 24 39.5 24 39.5Z" 
          fill="url(#hi-heart)" stroke="url(#hi-rim)" stroke-width="1.2" />

    <!-- Specular Highlight Curved Sheen on Left Lobe -->
    <path d="M12 17C12 13.5 14.5 11 17.5 11C19.5 11 21 12 22 13.5" 
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85" fill="none" />
    <circle cx="14" cy="19" r="1" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Inset Faith Cross in Heart Center -->
    <path d="M24 19V27M21.5 22.5H26.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
  </g>

  <!-- Twinkling Celestial Sparkle -->
  <path class="hi-star" d="M38 9V15M35 12H41" stroke="#FF5A7E" stroke-width="1.2" stroke-linecap="round" />
</svg>
